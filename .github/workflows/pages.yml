name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet jinja2 markdown pillow
      - name: Fetch images not in the repo yet
        run: python tools/fetch_images.py
      - name: Commit fetched images
        run: |
          git config user.name "site-build"
          git config user.email "site-build@users.noreply.github.com"
          git add assets/img
          if git diff --cached --quiet; then echo "No new images."; else
            git commit -m "Images fetched into the repo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build
        run: |
          if [ -f CNAME ]; then base=""; else base="/${{ github.event.repository.name }}"; fi
          python tools/build.py --out _site --base "$base"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
